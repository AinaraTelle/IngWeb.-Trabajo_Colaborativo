{% extends "base.html" %}
{% block titleXD %}Géneros{% endblock %}

{% block main %}
    <main>
        <section class="elegirGenero">
            <a href="{% url 'genA' %}" class="eleccionGenero">
                <div>Accion</div>
            </a>
            <a href="{% url 'genR' %}" class="eleccionGenero">
                <div>Romance</div>
            </a>
            <a href="{% url 'genF' %}" class="eleccionGenero">
                <div>Fantasia </div>
            </a>
            <a href="{% url 'genH' %}" class="eleccionGenero">
                <div> Historia</div>
            </a>
        </section>

        <h3 >
            A continuación se muestran los libros de {{Genero}}:
        </h3>
        
        <article class="main_ListaLibros">
        {% for libro in Libros %}
            <div class="muestraLibros">
                <ul class="datosLibro; " >
                    <li class="datosLibro"> {{libro.titulo}} </li>
                    <li class="datosLibro"> {{libro.autor}} </li>
                    <li class="datosLibro"> {{libro.precio}} </li>
                </ul>
            </div>   
        {% endfor %}
        </article> 
    </main>
{% endblock %}
