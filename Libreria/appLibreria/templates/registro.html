<!DOCTYPE html>
<html lang="es">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>    
    <header id="headerBase">
        <aside class="centradoEnMedio" >
            <img src="{% static 'imgs/Papirium_LogoCuadTxiki.png' %}" alt="Logo"
            height=220 width=220>
        </aside>
        <section>
            <h1 id="TituloPagina">
               {% block titleXD %} <b>Registrarse</b>{% endblock %} 
            </h1>


        </section>
        <div id="formS">
            <div id="formA">
                <form method="post" id="registro">
                    {%csrf_token%}
                    {{form.as_p}}
                    <button type="submit">Crear perfil e iniciar sesion</button>
                </form>
            </div>
            <script>
                document.addEventListener("DOMContentLoaded",function(){
                    const campos=document.querySelectorAll(
                        "#registro input[name='nombre'], " +
                        "#registro input[name='email'], " +
                        "#registro input[name='contrasenia'] "+
                        "#registro input[name='contrasenia2']");

                    campos.forEach(campo=>{
                        campo.addEventListener("focusout",function(){
                            if(this.value.trim()==''){
                                this.style.backgroundColor = "#f8d7da";
                            } else{
                                this.style.backgroundColor = "";
                            }
                        });

                        campo.addEventListener("input", function(){
                            if(this.value.trim()!==''){
                                this.style.backgroundColor = "";
                            }
                        });
                    });
                });
            </script>
        </div>
        
    </header>
    
    {% block main %}
    {% endblock %}

</body>
</html>
