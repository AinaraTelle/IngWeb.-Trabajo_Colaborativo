{% extends "base.html" %}

{% block main %}
<h2>Filtro de libros menores de {{Prec_lib}} euros:</h2>
   
<main class="main_ListaLibros">
    {% for libro in Libros %}
        <div class="muestraLibros">
            <ul>
                <li> {{libro.titulo}} </li>
                <li> {{libro.autor}} </li>
                <li> {{libro.precio}} </li>
            </ul>
        </div>   
    {% endfor %} 
</main>
     
{% endblock %}
